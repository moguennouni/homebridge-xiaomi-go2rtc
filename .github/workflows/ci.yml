name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Syntax
        run: |
          for file in index.js lib/*.js; do node --check "$file"; done
          node -e "for (const f of ['package.json', 'config.schema.json', 'config.example.json', 'lib/go2rtc-binaries.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: The go2rtc patch still applies to the official sources
        run: |
          VERSION=$(sed -n 's/^GO2RTC_VERSION="\(.*\)"$/\1/p' scripts/build-go2rtc.sh)
          git clone --quiet --depth 1 --branch "v$VERSION" https://github.com/AlexxIT/go2rtc.git "$RUNNER_TEMP/go2rtc"
          git -C "$RUNNER_TEMP/go2rtc" apply --check "$PWD/go2rtc-xiaomi-control/go2rtc-xiaomi-control.patch"
